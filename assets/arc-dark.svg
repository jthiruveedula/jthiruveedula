    <text x="374" y="194" text-anchor="end" font-size="15" font-weight="600" fill="#e6edf3">Data Engineer</text>
    <text x="374" y="212" text-anchor="end" font-size="12.5" fill="#8b949e">DSO MCS Group · Unified mainframe + Teradata</text>
  </g><g class="pop" style="animation-delay:1.00s">
    
    <circle cx="458" cy="221" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
