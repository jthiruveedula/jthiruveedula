<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-label="Career arc from ETL developer in 2015 to forward deployed AI architect in 2026">
  <style>
  /* Base state is fully visible; animations only play in from a hidden start, so a renderer that skips them still shows everything. */
  .draw { stroke-dasharray: 1600; animation: draw 2.4s ease-out .2s backwards; }
  .pop { animation: pop .5s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: 1600; } }
  @keyframes pop { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .draw, .pop { animation: none; } }
</style>
  <rect x=".5" y=".5" width="1199" height="391" rx="12" fill="#0d1117" stroke="#21262d"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="44" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="2">ELEVEN YEARS, ONE DIRECTION</text>
    <path d="M90 260 366 234 458 221 734 177 918 143 1102 107" fill="none" stroke="#21262d" stroke-width="2"/>
    <path class="draw" d="M90 260 366 234 458 221 734 177 918 143 1102 107" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
    <g class="pop" style="animation-delay:0.30s">
    
    <circle cx="90" cy="260" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="82" y="290" text-anchor="start" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1">2015</text>
    <text x="82" y="308" text-anchor="start" font-size="15" font-weight="600" fill="#e6edf3">ETL Developer</text>
    <text x="82" y="326" text-anchor="start" font-size="12.5" fill="#8b949e">InnoMinds · Enterprise warehouse pipelines</text>
  </g><g class="pop" style="animation-delay:0.65s">
    
    <circle cx="366" cy="234" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
