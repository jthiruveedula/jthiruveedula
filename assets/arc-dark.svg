    <text x="910" y="209" text-anchor="start" font-size="12.5" fill="#8b949e">NRG · Definity · COBOL to GCP via GenAI</text>
  </g><g class="pop" style="animation-delay:2.05s">
    <circle cx="1102" cy="107" r="14" fill="#58a6ff" fill-opacity=".15"/>
    <circle cx="1102" cy="107" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="1110" y="49" text-anchor="end" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1">2026 · NOW</text>
