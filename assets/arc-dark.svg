    <text x="450" y="287" text-anchor="start" font-size="12.5" fill="#8b949e">Charles Schwab · Multi-PB to GCP · $1M+ saved</text>
  </g><g class="pop" style="animation-delay:1.35s">
    
    <circle cx="734" cy="177" r="6" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
