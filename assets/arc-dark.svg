    <text x="742" y="137" text-anchor="end" font-size="15" font-weight="600" fill="#e6edf3">Lead Data Engineer</text>
    <text x="742" y="155" text-anchor="end" font-size="12.5" fill="#8b949e">HCA Healthcare · GenAI accelerators · 50% faster</text>
