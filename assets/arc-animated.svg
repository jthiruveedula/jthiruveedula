<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Career arc: ETL developer in 2015 to forward deployed AI architect in 2026">
<defs>
  <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#0a0d14"/>
  </linearGradient>
  <radialGradient id="acool" cx="0.5" cy="0.4" r="0.75">
    <stop offset="0" stop-color="#16233f" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#16233f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6f8fc9"/>
    <stop offset="0.5" stop-color="#c9a06a"/>
    <stop offset="1" stop-color="#ffb46b"/>
  </linearGradient>
  <radialGradient id="cometGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fffaf0"/>
    <stop offset="0.35" stop-color="#ffb46b" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nodePool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffb46b" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
  </radialGradient>
  <filter id="ablur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <radialGradient id="cometBloom" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.35"/>
    <stop offset="0.6" stop-color="#ffcf8e" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffcf8e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ashaftGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c07a" stop-opacity="0.28"/>
    <stop offset="0.7" stop-color="#e8c07a" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#e8c07a" stop-opacity="0"/>
  </linearGradient>
  <!-- NOTE: feTurbulence film grain was intentionally omitted.
     CairoSVG (the only static QA renderer available; headless Chromium hangs
     in this environment) renders every feTurbulence variant as an opaque
     black box or transparent — verified 2026-09-27 across 4 configurations.
     The failure mode is catastrophic (covers the artwork), and the grain
     cannot be visually verified here. Browsers render feTurbulence correctly,
     so to re-enable: add the grainF filter to <defs> and
     <rect width="W" height="H" filter="url(#grainF)"/> before the vignette. -->
<filter id="vigB" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<g><animateTransform attributeName="transform" type="translate" values="0 0; -10 5; 0 0" dur="26s" repeatCount="indefinite"/>
<rect x="-20" y="-10" width="1240" height="340" fill="url(#abg)"/>
<rect x="-20" y="-10" width="1240" height="340" fill="url(#acool)"/>
</g>
<text x="60" y="40" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" letter-spacing="6" fill="#e6c07a">THE ARC</text>
<path d="M 70 265 C 320 250 480 225 700 175 S 1000 95 1130 70" fill="none" stroke="#1e2c3a" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
<path d="M 70 265 C 320 250 480 225 700 175 S 1000 95 1130 70" fill="none" stroke="url(#arcGrad)" stroke-width="4.5" stroke-linecap="round"
  stroke-dasharray="1079.9" stroke-dashoffset="1079.9">
  <animate attributeName="stroke-dashoffset" values="1079.9;0" keyTimes="0;1" dur="6s" begin="-5.2s" repeatCount="indefinite"/>
</path>
<path d="M 70 265 C 320 250 480 225 700 175 S 1000 95 1130 70" id="arcCometPath" fill="none" stroke="none"/>
<g>
  <animateMotion dur="6s" begin="-4.8s" repeatCount="indefinite"><mpath href="#arcCometPath"/></animateMotion>
  <circle r="36" fill="url(#cometBloom)" filter="url(#ablur)"/>
  <circle r="18" fill="url(#cometGlow)" filter="url(#ablur)"/>
  <circle r="7" fill="#fffaf0"/>
</g>
<g>
  <circle cx="102.3" cy="263.0" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="102.3" cy="263.0" r="7" fill="none" stroke="#ffb46b" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="102.3" cy="263.0" r="6.5" fill="#ffd9a0" stroke="#ffb46b" stroke-width="1.5"/>
</g>
<text x="102.3" y="235.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2015</text>
<text x="102.3" y="215.0" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#c9d1d9">ETL Developer</text>
<g>
  <circle cx="306.7" cy="244.8" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="306.7" cy="244.8" r="7" fill="none" stroke="#ffb46b" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="306.7" cy="244.8" r="6.5" fill="#ffd9a0" stroke="#ffb46b" stroke-width="1.5"/>
</g>
<text x="306.7" y="280.8" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2019</text>
<text x="306.7" y="300.8" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#c9d1d9">Senior Data Engineer</text>
<g>
  <circle cx="520.2" cy="212.5" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="520.2" cy="212.5" r="7" fill="none" stroke="#ffb46b" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520.2" cy="212.5" r="6.5" fill="#ffd9a0" stroke="#ffb46b" stroke-width="1.5"/>
</g>
<text x="520.2" y="184.5" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2022</text>
<text x="520.2" y="164.5" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#c9d1d9">Lead Data Engineer</text>
<g>
  <circle cx="710.5" cy="172.6" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="710.5" cy="172.6" r="7" fill="none" stroke="#ffb46b" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
  </circle>
  <circle cx="710.5" cy="172.6" r="6.5" fill="#ffd9a0" stroke="#ffb46b" stroke-width="1.5"/>
</g>
<text x="710.5" y="208.6" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2024 &#183; Definity</text>
<text x="710.5" y="228.6" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c9d1d9">Forward Deployed Data Architect</text>
<g>
  <circle cx="909.7" cy="123.5" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="909.7" cy="123.5" r="7" fill="none" stroke="#ffb46b" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="909.7" cy="123.5" r="6.5" fill="#ffd9a0" stroke="#ffb46b" stroke-width="1.5"/>
</g>
<text x="909.7" y="93.5" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2024 &#183; NRG Energy</text>
<text x="909.7" y="73.5" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#c9d1d9">Forward Deployed Data Architect</text>
<g>
  <circle cx="1098.2" cy="76.4" r="20" fill="url(#nodePool)" filter="url(#ablur)" opacity="0.8"/>
  <circle cx="1098.2" cy="76.4" r="7" fill="none" stroke="#c2452f" stroke-width="2">
    <animate attributeName="r" values="7;17" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1098.2" cy="76.4" r="6.5" fill="#ffd9a0" stroke="#c2452f" stroke-width="1.5"/>
</g>
<text x="1098.2" y="112.4" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffd9a0">2026</text>
<text x="982.0" y="132.4" text-anchor="start" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" fill="#c9d1d9">Forward Deployed AI Architect</text>
<g><animateTransform attributeName="transform" type="translate" values="0 0; 12 -5; 0 0" dur="20s" repeatCount="indefinite"/>
<g opacity="0.55">
  <animate attributeName="opacity" values="0.4;0.65;0.4" dur="9s" repeatCount="indefinite"/>
  <polygon points="1060,-10 1120,-10 1100,200 1040,200" fill="url(#ashaftGrad)" filter="url(#ablur)"/>
  <polygon points="1120,-10 1160,-10 1140,200 1100,200" fill="url(#ashaftGrad)" filter="url(#ablur)" opacity="0.6"/>
  <polygon points="990,-10 1030,-10 1010,200 970,200" fill="url(#ashaftGrad)" filter="url(#ablur)" opacity="0.45"/>
</g>
</g>
<g fill="#000000" opacity="0.32" filter="url(#vigB)">
  <rect x="0" y="-60" width="1200" height="110"/>
  <rect x="0" y="270" width="1200" height="110"/>
  <rect x="-60" y="0" width="110" height="320"/>
  <rect x="1150" y="0" width="110" height="320"/>
</g>
</svg>
