  </radialGradient>
  <linearGradient id="oshaftGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c07a" stop-opacity="0.26"/>
    <stop offset="0.7" stop-color="#e8c07a" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#e8c07a" stop-opacity="0"/>
  </linearGradient>
  <!-- NOTE: feTurbulence film grain was intentionally omitted.
     CairoSVG (the only static QA renderer available; headless Chromium hangs
     in this environment) renders every feTurbulence variant as an opaque
     black box or transparent — verified 2026-09-27 across 4 configurations.
     The failure mode is catastrophic (covers the artwork), and the grain
     cannot be visually verified here. Browsers render feTurbulence correctly,
     so to re-enable: add the grainF filter to <defs> and
     <rect width="W" height="H" filter="url(#grainF)"/> before the vignette. -->
<filter id="vigB" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>
