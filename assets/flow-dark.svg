<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="How I ship: embed, prototype, evaluate, harden">
  <style>
  /* Base state is fully visible; animations only play in from a hidden start, so a renderer that skips them still shows everything. */
  .draw { stroke-dasharray: 1600; animation: draw 2.4s ease-out .2s backwards; }
  .pop { animation: pop .5s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: 1600; } }
  @keyframes pop { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .draw, .pop { animation: none; } }
</style>
  <rect x=".5" y=".5" width="1199" height="209" rx="12" fill="#0d1117" stroke="#21262d"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="42" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="2">HOW AN ENGAGEMENT RUNS</text>
    <g class="pop" style="animation-delay:0.2s">
    <rect x="40" y="64" width="262" height="112" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="62" y="98" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1.5">01</text>
    <text x="92" y="98" font-size="17" font-weight="600" fill="#e6edf3">Embed</text>
    <text x="62" y="130" font-size="13" fill="#8b949e">Sit with the team that owns</text>
    <text x="62" y="150" font-size="13" fill="#8b949e">the problem. Find the real metric.</text>
  </g><path d="M308 120h18m-6 -5l6 5-6 5" fill="none" stroke="#8b949e" stroke-width="1.5"/><g class="pop" style="animation-delay:0.5s">
    <rect x="332" y="64" width="262" height="112" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="354" y="98" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1.5">02</text>
    <text x="384" y="98" font-size="17" font-weight="600" fill="#e6edf3">Prototype</text>
    <text x="354" y="130" font-size="13" fill="#8b949e">Working slice on their data</text>
    <text x="354" y="150" font-size="13" fill="#8b949e">in days, not a slide deck.</text>
  </g><path d="M600 120h18m-6 -5l6 5-6 5" fill="none" stroke="#8b949e" stroke-width="1.5"/><g class="pop" style="animation-delay:0.8s">
    <rect x="624" y="64" width="262" height="112" rx="10" fill="#161b22" stroke="#21262d"/>
    <text x="646" y="98" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1.5">03</text>
    <text x="676" y="98" font-size="17" font-weight="600" fill="#e6edf3">Evaluate</text>
    <text x="646" y="130" font-size="13" fill="#8b949e">RAGAS, LLM-as-judge, human</text>
    <text x="646" y="150" font-size="13" fill="#8b949e">review. Prove it before scaling.</text>
  </g><path d="M892 120h18m-6 -5l6 5-6 5" fill="none" stroke="#8b949e" stroke-width="1.5"/><g class="pop" style="animation-delay:1.1s">
    <rect x="916" y="64" width="262" height="112" rx="10" fill="#161b22" stroke="#58a6ff"/>
    <text x="938" y="98" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1.5">04</text>
    <text x="968" y="98" font-size="17" font-weight="600" fill="#e6edf3">Harden</text>
    <text x="938" y="130" font-size="13" fill="#8b949e">Guardrails, observability, cost</text>
    <text x="938" y="150" font-size="13" fill="#8b949e">controls, handover playbook.</text>
  </g>
  </g>
</svg>
